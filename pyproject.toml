[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pen-pose"
version = "0.1.0"
description = "Pen pose dataset inspection and training"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dataset = ["numpy>=1.26", "opencv-python>=4.8"]
train = ["ultralytics==8.4.176", "torch>=2.0", "PyYAML>=6", "numpy>=1.26", "opencv-python>=4.8"]

[project.scripts]
pen-view = "pen_pose.viewer.app:main"
pen-prepare = "pen_pose.dataset.prepare:main"
pen-export = "pen_pose.dataset.export:main"
pen-review = "pen_pose.dataset.review:main"
pen-train = "pen_pose.training.train:main"
pen-evaluate = "pen_pose.evaluation.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
python-preference = "only-managed"
